name: Apply prepared DDT2 redesign
on:
  push:
    branches: [codex/ddt2-ui]
    paths: [.github/workflows/apply-ddt2-redesign.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the tested DDT2 redesign to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64,json,zlib,subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          expected='a141f7a177d2cc8edf87b4493524d8efbc9402d8'
          parent=subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          if parent != expected: raise RuntimeError('Base commit changed; refusing to overwrite concurrent work')
          entries=json.loads(zlib.decompress(base64.b64decode('')))
          for entry in entries:
              path=entry['path'];target=(root/path).resolve()
              if not target.is_relative_to(root) or path.startswith(('.git/','.github/')): raise RuntimeError('Unexpected path')
              if entry['content'] is None: target.unlink()
              else:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(entry['content'],encoding='utf8',newline='\n')
          subprocess.run(['git','add','--',*[e['path'] for e in entries]],check=True)
          subprocess.run(['git','commit','-m','Rebrand DDT2 with cinematic tournament pages and racing transitions'],check=True)
          subprocess.run(['git','push','origin','HEAD:codex/ddt2-ui'],check=True)
          PY
