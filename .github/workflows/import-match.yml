name: Import approved match
on:
  workflow_dispatch:
    inputs:
      filename:
        description: Filename of the Helper ZIP uploaded to the imports folder
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: ddt2-match-imports
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read the approved match ZIP
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          python - <<'PY'
          import os, pathlib, re, zipfile
          folder = pathlib.Path('imports').resolve()
          name = os.environ['FILENAME']
          path = (folder / name).resolve()
          if path.parent != folder or name != path.name or path.suffix.lower() != '.zip':
              raise ValueError('Choose a ZIP filename from imports/')
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              if len(set(names)) != len(names) or 'approved-results.json' not in names:
                  raise ValueError('Expected one approved-results.json')
              for entry in archive.infolist():
                  if entry.filename == 'approved-results.json' and entry.file_size <= 10_000_000:
                      continue
                  if not re.fullmatch(r'races/race-[1-7]\.json', entry.filename) or entry.file_size > 16 * 1024 * 1024:
                      raise ValueError('Unexpected entry in match ZIP')
              pathlib.Path(os.environ['RUNNER_TEMP'], 'match.json').write_bytes(archive.read('approved-results.json'))
          PY
      - name: Merge match and validate site
        run: |
          node scripts/import_match.cjs "$RUNNER_TEMP/match.json"
          node scripts/companion_bridge.cjs check
          if git diff --quiet -- data/companion && ! git ls-files --others --exclude-standard data/companion | grep -q .; then
            echo "UNCHANGED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          python scripts/tournament_engine.py build
          node scripts/build_public_stats.cjs
          python scripts/tournament_engine.py site
      - name: Publish approved data
        if: env.UNCHANGED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/companion/approved-results.json data/companion/bracket-slots.json data/tournament-statistics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved DDT2 match'
            git push origin HEAD:main
          fi
          gh workflow run tournament-pages.yml --ref main
