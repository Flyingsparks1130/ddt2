name: Apply prepared DDT2 event update
on:
  push:
    branches: [codex/ddt2-clean-season]
    paths: [.github/workflows/apply-clean-season.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the locally tested event update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64,json,zlib,subprocess,hashlib,urllib.request
          from pathlib import Path
          root=Path.cwd().resolve()
          if subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()!='da51a12fd545ab91d192b35b19ae31b038df9088':raise RuntimeError('Base changed; refusing to overwrite concurrent changes')
          entries=json.loads(zlib.decompress(base64.b64decode('')))
          for entry in entries:
              name=entry['path'];p=(root/name).resolve()
              if not p.is_relative_to(root) or name.startswith(('.git/','.github/')):raise RuntimeError('Unsafe path')
              if 'url' in entry:
                  data=urllib.request.urlopen(entry['url'],timeout=60).read()
                  if hashlib.sha256(data).hexdigest()!=entry['sha256']:raise RuntimeError('Artwork checksum mismatch')
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              elif entry['content'] is None:p.unlink()
              else:p.parent.mkdir(parents=True,exist_ok=True);p.write_text(entry['content'],encoding='utf8',newline='\n')
          subprocess.run(['git','add','--',*[e['path'] for e in entries]],check=True)
          subprocess.run(['git','commit','-m','Reset the event and add the refined DDT2 interface with exact outfit art'],check=True)
          subprocess.run(['git','push','origin','HEAD:codex/ddt2-clean-season'],check=True)
          PY
